[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "multi-platform-auto-upload"
version = "0.1.0"
description = "Multi-platform video and commerce content auto uploader"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = { text = "MIT" }
dependencies = [
  "loguru==0.7.3",
  "opencv-python>=4.13.0.92",
  "patchright==1.58.2",
  "playwright>=1.44.0",
  "qrcode==8.2",
  "requests==2.32.3",
  "segno>=1.6.6",
]

[project.scripts]
mpau = "mpau_cli:main"

[project.optional-dependencies]
web = [
  "Flask[async]==3.1.1",
  "flask-cors==6.0.0",
]

[tool.uv]
package = true

[tool.setuptools]
py-modules = ["conf", "mpau_cli"]
include-package-data = true

[tool.setuptools.packages.find]
include = ["uploader*", "utils*"]

[tool.setuptools.package-data]
utils = ["stealth.min.js"]
